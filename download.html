<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Produk - JOY CORP</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-gray-700">
    <i class="fas fa-shield-alt text-emerald-400 text-5xl mb-4"></i>
    <h1 class="text-2xl font-bold mb-2">Terima Kasih!</h1>
    <p class="text-sm text-gray-400 mb-6">Pembayaran berhasil. File Anda siap diunduh (Maksimal 1x).</p>
    
    <button id="btn-download" onclick="startDownload()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition disabled:opacity-50">
      <i class="fas fa-download mr-2"></i> Unduh Sekarang
    </button>
    
    <div id="msg" class="mt-4 text-xs text-yellow-400 hidden">Link sedang diproses...</div>
  </div>

  <script>
    let BACKEND_URL = localStorage.getItem('joy_backend_url') || "https://3dd7450abee241.lhr.life";
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function startDownload() {
      if(!token) return alert('Token tidak ditemukan di URL.');
      const btn = document.getElementById('btn-download');
      const msg = document.getElementById('msg');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
      msg.classList.remove('hidden');

      window.location.href = `${BACKEND_URL}/api/download/${token}`;
      
      setTimeout(() => {
        btn.innerHTML = '<i class="fas fa-check mr-2"></i> File Terkirim';
        msg.innerText = "Jika file tidak terunduh, link sudah hangus. Silakan chat Admin.";
        msg.classList.replace('text-yellow-400', 'text-red-400');
      }, 3000);
    }
  </script>
</body>
</html>
