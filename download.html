<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JOY CORPORATION - Portal Unduhan Produk</title>
<style>
:root{--bg:#0d0f12;--panel:#14171d;--card:#1a1e26;--border:#2a303c;--text:#e0e0e0;--muted:#8b92a0;--gold:#c5a059;--green:#4caf50;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--border);gap:10px}
.brand{font-weight:800;letter-spacing:1px}
.brand span{color:var(--gold)}
.tagline{font-size:.74rem;color:var(--gold);font-style:italic;margin-top:2px}
.badge{font-size:.72rem;color:var(--muted);text-align:right}
.wrap{max-width:680px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
h1{color:var(--gold);font-size:1.2rem;margin-bottom:8px}
p.sub{font-size:.85rem;color:var(--muted);line-height:1.5;margin-bottom:14px}
label{font-size:.78rem;color:var(--muted);display:block}
input{width:100%;background:var(--bg);border:1px solid var(--border);color:#fff;padding:10px;border-radius:6px;margin:6px 0 12px;font-size:.85rem}
input:focus{outline:none;border-color:var(--gold)}
.btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:6px;cursor:pointer;font-size:.82rem;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
.btn-gold:hover{opacity:.9;color:#000}
.status{padding:4px 9px;border-radius:4px;font-size:.72rem;font-weight:700;text-transform:uppercase;display:inline-block}
.paid{background:rgba(76,175,80,.2);color:var(--green)}
.pending{background:rgba(197,160,89,.2);color:var(--gold)}
.meta-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.84rem;gap:12px}
.meta-row span:first-child{color:var(--muted)}
.box-deliver{background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.4);border-radius:8px;padding:14px;margin-top:14px}
.box-warn{background:rgba(197,160,89,.1);border:1px solid var(--gold);border-radius:8px;padding:14px;margin-top:14px;font-size:.83rem;color:var(--muted)}
.err{color:var(--red);font-size:.84rem;margin-top:10px}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">JOY <span>CORPORATION</span></div>
    <div class="tagline">"Kami ada karena kamu Ade"</div>
  </div>
  <div class="badge" id="connStatus">Siap memeriksa pesanan</div>
</header>

<main class="wrap">
  <div class="card">
    <h1>Akses & Unduhan Produk Digital</h1>
    <p class="sub">Masukkan ID Pesanan untuk memeriksa status pembayaran dan membuka akses produk dari JOY CORPORATION.</p>
    <label>ID Pesanan</label>
    <input id="orderInput" placeholder="Contoh: ord_123456">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="lookupOrder()">Cek Pesanan</button>
      <a class="btn" href="index.html">Kembali ke Control Center</a>
    </div>
    <div id="resultBox"></div>
  </div>
</main>

<script>
  const BACKEND_STORAGE_KEY = 'joy_corp_backend_url';

  function getProxyBase() {
    const saved = (localStorage.getItem(BACKEND_STORAGE_KEY) || '').trim().replace(/\/+$/, '');
    if (saved) {
      return saved.endsWith('/api/proxy') ? saved : `${saved}/api/proxy`;
    }
    return '/api/proxy';
  }

  async function apiFetch(path) {
    const cleanPath = path.replace(/^\/+/, '');
    const res = await fetch(`${getProxyBase()}/${cleanPath}`, {
      headers: { 'Content-Type': 'application/json' }
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`HTTP ${res.status}: ${err}`);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function lookupOrder(overrideId) {
    const orderId = (overrideId || document.getElementById('orderInput').value || '').trim();
    const box = document.getElementById('resultBox');
    const statusEl = document.getElementById('connStatus');

    if (!orderId) {
      box.innerHTML = '<div class="err">Masukkan ID Pesanan terlebih dahulu.</div>';
      return;
    }

    document.getElementById('orderInput').value = orderId;
    statusEl.textContent = 'Memeriksa…';
    box.innerHTML = '<p style="font-size:.82rem;color:var(--muted);margin-top:12px">Mencari data pesanan…</p>';

    try {
      const rows = await apiFetch(`rest/v1/orders?id=eq.${encodeURIComponent(orderId)}&select=*,products(title,description)&limit=1`);
      statusEl.textContent = 'Terhubung';

      if (!Array.isArray(rows) || rows.length === 0) {
        box.innerHTML = '<div class="err">Pesanan dengan ID tersebut tidak ditemukan.</div>';
        return;
      }

      const o = rows[0];
      const prodTitle = (o.products && o.products.title) || 'Produk Digital JOY CORPORATION';
      const prodDesc = (o.products && o.products.description) || 'Paket produk digital resmi dari JOY CORPORATION.';
      const isPaid = String(o.payment_status || '').toLowerCase() === 'paid';

      const paketKonten = [
        `JOY CORPORATION - BUKTI & AKSES PRODUK`,
        `"Kami ada karena kamu Ade"`,
        `----------------------------------------`,
        `ID Pesanan : ${o.id}`,
        `Produk     : ${prodTitle}`,
        `Email      : ${o.customer_email || '-'}`,
        `Nominal    : $${Number(o.amount || 0).toFixed(2)} ${o.currency || 'USD'}`,
        `Status     : ${o.payment_status || 'pending'}`,
        `Tanggal    : ${new Date(o.created_at).toLocaleString('id-ID')}`,
        ``,
        `Deskripsi Produk:`,
        prodDesc,
        ``,
        `Catatan: Simpan halaman atau catatan ini sebagai bukti transaksi resmi.`
      ].join('\n');

      const blob = new Blob([paketKonten], { type: 'text/plain;charset=utf-8' });
      const blobUrl = URL.createObjectURL(blob);

      box.innerHTML = `
        <div style="margin-top:16px">
          <div class="meta-row"><span>ID Pesanan</span><strong>${escapeHtml(String(o.id))}</strong></div>
          <div class="meta-row"><span>Produk</span><strong>${escapeHtml(prodTitle)}</strong></div>
          <div class="meta-row"><span>Email Pembeli</span><span>${escapeHtml(o.customer_email || '-')}</span></div>
          <div class="meta-row"><span>Jumlah</span><strong style="color:var(--gold)">$${Number(o.amount || 0).toFixed(2)} ${escapeHtml(o.currency || 'USD')}</strong></div>
          <div class="meta-row"><span>Status Bayar</span><span class="status ${isPaid ? 'paid' : 'pending'}">${escapeHtml(o.payment_status || 'pending')}</span></div>
          ${isPaid ? `
            <div class="box-deliver">
              <div style="font-weight:700;color:var(--green);margin-bottom:6px">Pembayaran Terverifikasi — Produk Siap Diunduh</div>
              <p style="font-size:.82rem;color:var(--muted);margin-bottom:10px">${escapeHtml(prodDesc)}</p>
              <a class="btn btn-gold" href="${blobUrl}" download="JOY-CORP-${escapeHtml(String(o.id))}.txt">Unduh Paket Pesanan</a>
            </div>
          ` : `
            <div class="box-warn">
              Pesanan ini masih berstatus <b>${escapeHtml(o.payment_status || 'pending')}</b>. Setelah pembayaran dikonfirmasi menjadi <b>paid</b>, tombol unduhan akan terbuka otomatis di halaman ini.
            </div>
          `}
        </div>
      `;
    } catch (err) {
      statusEl.textContent = 'Gagal Cek';
      box.innerHTML = `<div class="err">Gagal memuat pesanan: ${escapeHtml(err.message)}</div>`;
    }
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const orderParam = params.get('order');
    if (orderParam) lookupOrder(orderParam);
  });
</script>
</body>
</html>
