<script>
  // ====== KONFIGURASI LANGSUNG (anon key = publik, aman) ======
  const SUPABASE_URL = 'https://nszdjbnoikdvqquhxrhe.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5zemRqYm5vaWtkdnFxdWh4cmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMjk0MzcsImV4cCI6MjEwOTYwNTQzN30.sMfy_CBJxrXCmEjZHPt5l4mjmNw2fTN476ul2L_FAtU';
  // ============================================================

  const STORAGE_KEY = 'joy_supabase_config';
  let sb = null;

  function saveConfig() {
    const url = document.getElementById('supabaseUrl').value.trim();
    const key = document.getElementById('supabaseKey').value.trim();
    if (!url || !key) { alert('Isi URL dan Anon Key dulu.'); return; }
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ url, key }));
    initSupabase();
    alert('Koneksi override tersimpan!');
  }

  function initSupabase() {
    // override opsional dari tab Pengaturan; default pakai konstanta
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    const url = (saved && saved.url) || SUPABASE_URL;
    const key = (saved && saved.key) || SUPABASE_ANON_KEY;

    document.getElementById('supabaseUrl').value = url;
    document.getElementById('supabaseKey').value = key;

    try {
      sb = window.supabase.createClient(url, key);
      document.getElementById('authStatus').textContent = 'Supabase terhubung';
      loadCatalog();
      loadProduction();
      loadOrders();
    } catch (err) {
      document.getElementById('authStatus').textContent = 'Gagal terhubung';
      console.error(err);
    }
  }

  function setTab(tab) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.menu').forEach(m => m.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    document.querySelector(`.menu[data-tab="${tab}"]`).classList.add('active');
  }
  document.querySelectorAll('.menu').forEach(m => m.onclick = () => setTab(m.dataset.tab));

  async function loadCatalog() {
    const grid = document.getElementById('catalogGrid');
    grid.innerHTML = '';
    if (!sb) { grid.innerHTML = '<p style="color:var(--muted)">Belum terhubung.</p>'; return; }
    try {
      const { data, error } = await sb
        .from('products').select('*')
        .eq('status', 'published')
        .order('created_at', { ascending: false });
      if (error) throw error;
      if (!data || data.length === 0) {
        grid.innerHTML = '<p style="color:var(--muted)">Belum ada produk yang dipublikasikan.</p>';
        return;
      }
      data.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product';
        card.innerHTML = `
          <h3>${p.title || 'Tanpa Judul'}</h3>
          <p style="font-size:.8rem;color:var(--muted)">${p.description || ''}</p>
          <div class="price">$${Number(p.price_usd || 0).toFixed(2)}</div>
          <button class="btn btn-gold" onclick='startCheckout(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Beli Sekarang</button>
        `;
        grid.appendChild(card);
      });
    } catch (err) {
      grid.innerHTML = `<p style="color:var(--red)">Kesalahan: ${err.message}</p>`;
      console.error(err);
    }
  }

  async function startCheckout(product) {
    if (!sb) return alert('Hubungkan Supabase dulu.');
    const email = prompt('Masukkan email untuk menerima produk:');
    if (!email) return;
    try {
      const { error } = await sb.from('orders').insert({
        product_id: product.id, customer_email: email,
        amount: product.price_usd, currency: 'USD',
        payment_provider: 'pending', payment_status: 'pending'
      });
      if (error) throw error;
      alert('Pesanan dibuat. Pembayaran otomatis menyusul (Tahap 9).');
      loadOrders();
    } catch (err) { alert('Gagal: ' + err.message); }
  }

  async function loadProduction() {
    const body = document.getElementById('productionBody');
    body.innerHTML = '';
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('production_items').select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;
      if (!data || data.length === 0) {
        body.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">Belum ada item produksi.</td></tr>';
        return;
      }
      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.title}</td>
          <td>${item.product_type || '-'}</td>
          <td><span class="status ${item.status}">${item.status}</span></td>
          <td><button class="btn" onclick='advanceStatus(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Majukan</button></td>
        `;
        body.appendChild(tr);
      });
    } catch (err) {
      body.innerHTML = `<tr><td colspan="4" style="color:var(--red)">Error: ${err.message}</td></tr>`;
    }
  }

  async function createProductionItem() {
    if (!sb) return alert('Hubungkan Supabase dulu.');
    const title = document.getElementById('pTitle').value.trim();
    const type = document.getElementById('pType').value;
    const idea = document.getElementById('pIdea').value.trim();
    if (!title || !idea) return alert('Isi judul dan ide produk dulu.');
    try {
      const { error } = await sb.from('production_items').insert({
        title, product_type: type, idea, status: 'idea'
      });
      if (error) throw error;
      document.getElementById('pTitle').value = '';
      document.getElementById('pIdea').value = '';
      loadProduction();
    } catch (err) { alert('Gagal: ' + err.message); }
  }

  async function advanceStatus(item) {
    const flow = ['idea','drafting','owner_review','qc','ready','published'];
    const next = flow[Math.min(flow.indexOf(item.status) + 1, flow.length - 1)];
    if (item.status === 'qc' && next === 'ready' && !confirm('Sudah selesai checklist QC?')) return;
    try {
      const { error } = await sb.from('production_items').update({ status: next }).eq('id', item.id);
      if (error) throw error;
      loadProduction();
    } catch (err) { alert(err.message); }
  }

  async function loadOrders() {
    const body = document.getElementById('ordersBody');
    body.innerHTML = '';
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('orders').select('*, products(title)')
        .order('created_at', { ascending: false }).limit(50);
      if (error) throw error;
      if (!data || data.length === 0) {
        body.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">Belum ada pesanan.</td></tr>';
        return;
      }
      data.forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${new Date(o.created_at).toLocaleString('id-ID')}</td>
          <td>${o.products?.title || 'Produk'}</td>
          <td>$${Number(o.amount).toFixed(2)}</td>
          <td>${o.payment_provider}</td>
          <td>${o.payment_status}</td>
        `;
        body.appendChild(tr);
      });
    } catch (err) {
      body.innerHTML = `<tr><td colspan="5" style="color:var(--red)">Error: ${err.message}</td></tr>`;
    }
  }

  window.addEventListener('DOMContentLoaded', initSupabase);
               </script>
