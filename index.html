function sha256(ascii){
 const rr=(v,a)=>(v>>>a)|(v<<(32-a));const mp=Math.pow,mw=mp(2,32);let result='',i,j;
 const words=[],bl=ascii.length*8;let hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length;const ic={};

 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((bl/mw)|0);words[words.length]=bl;
 for(j=0;j<words.length;){const w=words.slice(j,j+=16);const oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);

 for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
 return result;
}

async function makePdf(a){
 const {jsPDF}=await pdfLib();
 const d=new jsPDF({unit:'pt',format:'a4'});
 const g=gFor(a);
 const W=595,H=842,M=54,MW=W-2*M,BOT=H-M;

 d.setFillColor(29,53,87);d.rect(0,0,W,H,'F');
 d.setDrawColor(255,255,255);d.setLineWidth(3);d.rect(24,24,W-48,H-48);
 d.setFillColor(224,142,69);d.rect(M,90,90,6,'F');
 d.setTextColor(255,255,255);d.setFont('times','bold');d.setFontSize(34);
 let cy=130;
 d.splitTextToSize(cl(g.title),MW).forEach(l=>{d.text(l,M,cy);cy+=42});
 if(g.sub){
  d.setFont('times','italic');d.setFontSize(17);d.setTextColor(244,213,141);
  cy+=12;
  d.splitTextToSize(cl(g.sub),MW).forEach(l=>{d.text(l,M,cy);cy+=24});
 }
 d.setFont('helvetica','bold');d.setFontSize(13);d.setTextColor(224,142,69);
 d.text('JOY CORPORATION',M,H-64);

 const bodyText=cl(a.final||a.produk||'');
 d.addPage();
 d.setTextColor(31,42,51);
 let y=M;

 const ensureSpace=need=>{
  if(y+need>BOT){
   d.addPage();
   d.setTextColor(31,42,51);
   y=M;
  }
 };

 bodyText.split('\n').forEach(raw=>{
  let t=raw.trim();
  if(!t){ensureSpace(12);y+=12;return}

  const isH=/^#{1,4}\s+/.test(t);
  if(isH){
   t=t.replace(/^#{1,4}\s+/,'');
   d.setFont('helvetica','bold');d.setFontSize(15);
   ensureSpace(28);
   y+=6;
   d.splitTextToSize(t,MW).forEach(l=>{ensureSpace(20);d.text(l,M,y);y+=20});
   y+=6;
   return;
  }

  d.setFont('helvetica','normal');d.setFontSize(11);
  t=t.replace(/^[*\-]\s+/,'- ');
  d.splitTextToSize(t,MW).forEach(l=>{
   ensureSpace(16);
   d.text(l,M,y);
   y+=15.5;
  });
 });

 return d.output('blob');
}

function shortOf(a){
 if(a.short)return a.short;const g=gFor(a);const d=String(g.desc||'').replace(/\s+/g,' ').trim();
 if(!d)return g.sub||'';if(d.length<=220)return d;
 const cut=d.slice(0,220);const i=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('! '),cut.lastIndexOf('? '));
